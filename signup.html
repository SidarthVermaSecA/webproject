  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <h2 class="mb-4">Summit Account Sign Up</h2>
          <form id="signupForm">
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" required />
            </div>
            <div class="mb-3">
              <label for="emailAddress" class="form-label">Email Address</label>
              <input
                type="email"
                class="form-control"
                id="emailAddress"
                required
              />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                required
              />
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label"
                >Confirm Password</label
              >
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                required
              />
            </div>
            <div class="mb-3">
              <label for="accountType" class="form-label">Account Type</label>
              <select class="form-select" id="accountType">
                <option selected>Choose...</option>
                <option value="savings">Savings Account</option>
                <option value="checking">Checking Account</option>
                <option value="business">Business Account</option>
              </select>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="termsCheck" />
              <label class="form-check-label" for="termsCheck"
                >I agree to the Terms and Conditions</label
              >
            </div>
            <button
              type="submit"
              class="btn btn-primary"
              style="background-color: red; border-color: black"
            >
              Sign Up
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", function (event) {
          event.preventDefault(); // Correct method to prevent default form submission
          alert("Sign Up Completed Successfully!"); // Complete message in alert
          this.reset(); // Optional: Reset form fields after submission
        });
    </script>
  </body>
